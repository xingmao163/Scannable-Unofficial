name: Build

# 仅手动触发：Actions → Build → Run workflow → 从下拉框选目标分支。
# workflow_dispatch 的按钮要求本文件存在于默认分支(main)上；按钮出现后可选任意分支运行，
# 届时用的是该分支自己这份文件。
on:
  workflow_dispatch:

# 同一分支连点两次时，取消上一次仍在排队/运行的构建，不白占 runner。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 只取当前提交即可，checkout 的 fetch-depth 默认就是 1，无需显式声明。
      - uses: actions/checkout@v4

      # 本文件在四个分支上唯一不同的一行：26.1.2 用 '25'，其余分支用 '21'。
      # 必须与本分支 gradle.properties 的 java_version 一致 —— build.gradle 用它设置
      # java.toolchain.languageVersion，而 build.gradle 必须跨分支逐字节一致。
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      # gradlew 在 git 里是 100644（没有可执行位），Linux runner 上不做这步会 Permission denied。
      - name: Make gradlew executable
        run: chmod +x gradlew

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-cleanup: on-success

      - uses: gradle/actions/wrapper-validation@v4

      - name: Build
        run: ./gradlew build --stacktrace --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: Scannable-Unofficial-${{ github.ref_name }}-${{ github.sha }}
          path: build/libs/*.jar
          retention-days: 14
          compression-level: 9
          if-no-files-found: error