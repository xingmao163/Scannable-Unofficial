name: Build

on:
  push:
    branches: [main, '1.21.2', '1.21.4', '26.1.2']
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - 'docs/**'
  pull_request:
    branches: [main, '1.21.2', '1.21.4', '26.1.2']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 每个版本分支只构建自己那一个版本，版本信息来自本分支的 gradle.properties，
      # 因此不需要版本矩阵。本文件在各分支上只有 java-version 一项不同，
      # 必须与 gradle.properties 的 25sion 一致（26.x 用 25，1.21.x 用 21）。
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Make gradlew executable
        run: chmod +x gradlew

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-cleanup: on-success

      - uses: gradle/actions/wrapper-validation@v4

      # 每个版本分支的关键防线：该版本坏掉会在这里立刻暴露，
      # 而不再依赖"主分支能编过"这种无法覆盖其它版本的间接证据。
      - name: Build
        run: ./gradlew build --stacktrace --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: Scannable-Unofficial-${{ github.ref_name }}-${{ github.sha }}
          path: build/libs/*.jar
          retention-days: 14
          compression-level: 9
          if-no-files-found: warn
