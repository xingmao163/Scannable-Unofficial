// 各版本分支共享的 Maven 仓库列表。
//
// 注意：这里不再有版本表。多版本源码覆盖（原来的 supportedVersions +
// build.gradle 里的 mergeNeoforgeSources/mergeNeoforgeResources）已废弃 ——
// 每个 Minecraft 版本现在是独立分支，版本配置在各自分支的 gradle.properties。
ext {
    sharedRepositories = [
        [name: 'Maven Central', url: 'https://repo.maven.apache.org/maven2'],
        [name: 'NeoForged', url: 'https://maven.neoforged.net/releases'],
        [name: 'TerraformersMC', url: 'https://maven.terraformersmc.com/'],
        [name: 'ParchmentMC', url: 'https://maven.parchmentmc.org'],
        [name: 'BlameJared', url: 'https://maven.blamejared.com'],
        [name: 'Modrinth', url: 'https://api.modrinth.com/maven'],
    ]
}
