plugins {
    id 'java-library'
    id 'maven-publish'
    alias libs.plugins.neomoddev
    id 'idea'
}

apply from: 'gradle/versions.gradle'

// 版本配置全部来自本分支的 gradle.properties。
// 各版本分支的 build.gradle 必须保持逐字节一致，否则分支间无法无冲突合并。
ext.minecraft_version       = findProperty('minecraft_version')
ext.minecraft_version_range = findProperty('minecraft_version_range')
ext.neo_version             = findProperty('neo_version')
ext.neo_version_range       = findProperty('neo_version_range') ?: "[${neo_version},)"
ext.parchment_minecraft_version = findProperty('parchment_minecraft_version')
ext.parchment_mappings_version  = findProperty('parchment_mappings_version')
ext.jei_version             = findProperty('jei_version')
ext.emi_version             = findProperty('emi_version') ?: ''
ext.java_version            = (findProperty('java_version') ?: '21') as int

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version)

version = mod_version
group = mod_group_id

base {
    archivesName = "Scannable_Unofficial-Neo${minecraft_version}"
}

sourceSets.main.java.srcDirs = [file('neoforge/src/main/java')]
sourceSets.main.resources {
    srcDir('neoforge/src/main/resources')
    exclude('**/*.bbmodel')
}

def dataGenArgs = ['--mod', project.mod_id, '--all',
                    '--output', file('neoforge/src/generated/resources/').getAbsolutePath(),
                    '--existing', file('neoforge/src/main/resources/').getAbsolutePath()]

neoForge {
    version = project.neo_version

    if (project.parchment_mappings_version) {
        parchment {
            mappingsVersion = project.parchment_mappings_version
            minecraftVersion = project.parchment_minecraft_version
        }
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // DataGen 入口随版本而异：1.21.1~1.21.3 用 `data`，
        // 1.21.4+ 拆成 `serverData` + `clientData`，26.1.2 只用 `clientData`。
        // 版本不适用的 run 在本分支直接删除即可 —— 其余内容请与本项目其它版本分支保持一致。
        data {
            data()
            programArguments.addAll dataGenArgs
        }
        serverData {
            serverData()
            programArguments.addAll dataGenArgs
        }
        clientData {
            clientData()
            programArguments.addAll dataGenArgs
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    sharedRepositories.each { repo ->
        maven {
            name = repo.name
            url = repo.url
        }
    }
}
if (!jei_version) {
    sourceSets.main.java {
        exclude 'com/starmao/scannable/integration/jei/**'
    }
}

if (!emi_version) {
    sourceSets.main.java {
        exclude 'com/starmao/scannable/integration/emi/**'
    }
}
dependencies {
    if (jei_version) {
        compileOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
        localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    }

    if (emi_version) {
        compileOnly "maven.modrinth:emi:${emi_version}"
        runtimeOnly "maven.modrinth:emi:${emi_version}"
    }
}

tasks.named("processResources", ProcessResources) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "neoforge/src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}
